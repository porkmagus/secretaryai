services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: secretary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secretary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ../../runtime/postgres:/pgdata

  redis:
    image: redis:7.4-alpine
    container_name: secretary-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ../../runtime/redis/data:/data

  searxng:
    image: searxng/searxng
    container_name: secretary-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: secretary-crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    shm_size: 1g
    # Uncomment and configure the following if you want LLM support
    # env_file:
    #   - ../../.llm.env
    # volumes:
    #   - ./my-custom-config.yml:/app/config.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
