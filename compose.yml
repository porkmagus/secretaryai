name: secretary-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: secretary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secretary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./runtime/postgres:/pgdata

  redis:
    image: redis:7.4-alpine
    container_name: secretary-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./runtime/redis/data:/data

  searxng:
    image: searxng/searxng
    container_name: secretary-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: secretary-worker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then((r)=>{if(!r.ok)process.exit(1);}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
    volumes:
      - ./runtime:/workspace/runtime

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: secretary-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>{if(!r.ok)process.exit(1);}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
